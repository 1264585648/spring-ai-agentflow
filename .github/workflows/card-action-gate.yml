name: AgentFlow review regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run all tests (no skip or curated exclusion)
        shell: bash
        run: |
          set +e
          mvn -B --no-transfer-progress test > /tmp/agentflow-maven.log 2>&1
          result=$?
          set -e
          mkdir -p target/ci-logs
          cp /tmp/agentflow-maven.log target/ci-logs/maven.log
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/agentflow-maven.log').read_text(errors='replace').splitlines()
          print('=== Full-suite test summaries ===')
          for line in lines:
              if 'Tests run:' in line or 'BUILD SUCCESS' in line or 'BUILD FAILURE' in line:
                  print(line)
          print('=== Failure diagnostics (first five occurrences) ===')
          diagnostics = [line for line in lines if 'SUPERSESSION_DIAGNOSTIC' in line]
          for line in diagnostics[:5]:
              print(line)
          print('=== Maven final output ===')
          print('\n'.join(lines[-65:]))
          PY
          exit "$result"
      - name: Preserve full Maven output and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-test-evidence
          path: |
            target/ci-logs/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc --strict --target ES2022 --module commonjs --lib ES2022,DOM --outDir /tmp/agentflow-client-tests src/api/sseClient.ts src/api/turnCancellation.ts
      - run: CARD_CLIENT_JS=/tmp/agentflow-client-tests/api/sseClient.js node --test tests/client-regression.test.cjs tests/turn-client-regression.test.cjs
      - run: npm run build
      - name: Type-check browser test entry
        run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --jsx react-jsx --lib ES2022,DOM --esModuleInterop --skipLibCheck tests/chat-drawer-regression.tsx
      - name: Build isolated mounted-component regression page
        run: npx vite build --config vite.regression.config.ts
      - name: Real Chrome lifecycle regressions (no mock React and no skip)
        run: python3 tests/run-browser-regression.py
