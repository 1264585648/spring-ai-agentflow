name: Card ActionGate regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-action-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run focused offline regression tests
        run: >-
          mvn -B
          -Dtest=ActionGateTest,ActionGateConfigurationTest,CardRegistryTest,CardInteractionControllerTest,OpsActionCardSubmitHandlerTest,DirectWriteToolBoundaryTest,TroubleshootSubAgentTest,AgentPipelineServiceImplTest,MultiTurnPipelineIntegrationTest,CapabilityToolsTest,L1ToolDispatcherAllowlistTest
          test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc --strict --target ES2022 --module commonjs --lib ES2022,DOM --outDir /tmp/agentflow-card-tests src/api/sseClient.ts
      - run: CARD_CLIENT_JS=/tmp/agentflow-card-tests/api/sseClient.js node --test tests/card-submit.test.cjs
      - run: npm run build
