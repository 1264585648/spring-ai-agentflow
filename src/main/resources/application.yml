spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: spring-ai-agent

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:enterprise_agent_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

# ===================================================================
# Apollo 分布式配置中心配置 (多 Pod 集群部署选配)
# 说明:
# 1. 本地单机/CI 环境: enabled 保持 false，依赖 JVM 内部 Spring Event 与启动预热即可；
# 2. 线上多节点集群环境: 开启 enabled: true，所有 Pod 自动接入 HTTP 长轮询广播，毫秒级同步最新规则。
# ===================================================================
app:
  id: spring-ai-agent

apollo:
  bootstrap:
    enabled: ${APOLLO_BOOTSTRAP_ENABLED:false}
    namespaces: application,agent.l1.rules
  meta: ${APOLLO_META:http://localhost:8080}
  rules:
    namespace: ${APOLLO_RULES_NAMESPACE:agent.l1.rules}
